    <div class="app">
      <header class="bar">
        <div class="bar__brand">
          <svg class="bar__mark"><use href="#i-scan" /></svg>
          <span class="bar__name">Omni Upscale</span>
        </div>
        <div class="bar__right">
          <div class="status" id="statusPills"></div>
          <button type="button" class="icon-btn" id="themeBtn" data-tip="切换主题">
            <svg><use href="#i-moon" /></svg>
          </button>
        </div>
      </header>

      <main class="stage">
        <div class="viewport">
          <div class="dropzone" id="dropzone">
            <div class="dropzone__inner">
              <svg class="dropzone__icon"><use href="#i-image" /></svg>
              <h1 class="dropzone__title">拖入图片或视频</h1>
              <p class="dropzone__desc">批量拖入，或</p>
              <div class="dropzone__actions">
                <button type="button" class="text-btn" id="pickImageBtn">选择图片</button>
                <span class="dot-sep">·</span>
                <button type="button" class="text-btn" id="pickVideoBtn">选择视频</button>
              </div>
            </div>
          </div>

          <div class="preview" id="preview" hidden>
            <div class="preview__head">
              <div class="preview__title" id="previewTitle"></div>
              <div class="preview__actions" id="previewActions"></div>
            </div>
            <div class="preview__body" id="previewBody"></div>
          </div>
        </div>

        <section class="queue" id="queue" hidden>
          <div class="queue__head">
            <span class="queue__label">队列 <span id="queueCount">0</span></span>
            <button type="button" class="text-btn text-btn--dim" id="clearBtn">清理</button>
          </div>
          <div class="queue__body" id="queueBody"></div>
        </section>
      </main>

      <footer class="dock">
        <div class="dock__left">
          <div class="switch" id="modeSwitch">
            <button type="button" class="switch__btn is-active" data-mode="image" data-tip="图片">
              <svg><use href="#i-image" /></svg>
            </button>
            <button type="button" class="switch__btn" data-mode="video" data-tip="视频">
              <svg><use href="#i-video" /></svg>
            </button>
          </div>

          <div class="dock__group">
            <select class="bare" id="engineSelect"></select>
            <select class="bare" id="modelSelect"></select>
            <div class="seg" id="scaleChips"></div>
          </div>

          <div class="dock__group" id="longEdgeGroup" hidden>
            <div class="seg" id="longEdgeChips"></div>
          </div>
        </div>

        <div class="dock__right">
          <button type="button" class="icon-btn" id="moreBtn" data-tip="更多设置">
            <svg><use href="#i-sliders-horizontal" /></svg>
          </button>
          <button type="button" class="cta" id="runBtn" disabled>
            <span>开始超分</span>
          </button>
        </div>
      </footer>
    </div>

    <dialog class="sheet" id="settingsDialog">
      <header class="sheet__head">
        <h2 class="sheet__title">设置</h2>
        <button type="button" class="icon-btn" data-close="settingsDialog" data-tip="关闭">
          <svg><use href="#i-x" /></svg>
        </button>
      </header>

      <div class="sheet__body">
        <section class="group">
          <h3 class="group__title">输出</h3>

          <div class="row" id="formatField">
            <span class="row__label">图片格式</span>
            <div class="seg" id="formatChips"></div>
          </div>

          <div class="row" id="qualityField">
            <span class="row__label">视频质量</span>
            <div class="seg" id="qualityChips"></div>
          </div>

          <div class="row row--block">
            <span class="row__label">保存位置</span>
            <div class="seg seg--wide" id="outputModeChips">
              <button type="button" class="seg__btn" data-output="suffix">源目录</button>
              <button type="button" class="seg__btn" data-output="folder">指定目录</button>
            </div>
            <button type="button" class="text-btn text-btn--path" id="pickDirBtn" hidden>
              <svg><use href="#i-folder-open" /></svg><span id="dirPath">选择目录</span>
            </button>
          </div>
        </section>

        <section class="group" id="noiseField" hidden>
          <h3 class="group__title">引擎参数</h3>
          <div class="row row--block">
            <span class="row__label">降噪强度</span>
            <div class="seg seg--wide" id="noiseChips"></div>
          </div>
        </section>

        <section class="group">
          <h3 class="group__title">界面</h3>
          <div class="row row--block">
            <span class="row__label">显示比例</span>
            <div class="seg seg--wide" id="uiScaleChips"></div>
            <p class="row__hint">也可以随时按 Ctrl + 加号 / 减号调整</p>
          </div>
        </section>

        <section class="group">
          <h3 class="group__title">运行环境</h3>
          <div class="env" id="envList"></div>
          <button type="button" class="text-btn" id="reprobeBtn">
            <svg class="probe-icon"><use href="#i-loader-circle" /></svg>
            <span id="reprobeLabel">重新检测 AI 引擎</span>
          </button>
        </section>
      </div>

      <footer class="sheet__foot">
        <span class="sheet__note">输出始终为新文件，不会覆盖原素材</span>
        <button type="button" class="cta" data-close="settingsDialog">完成</button>
      </footer>
    </dialog>

    <dialog class="sheet sheet--wide" id="taskDialog">
      <header class="sheet__head">
        <h2 class="sheet__title" id="taskTitle">任务详情</h2>
        <button type="button" class="icon-btn" data-close="taskDialog" data-tip="关闭">
          <svg><use href="#i-x" /></svg>
        </button>
      </header>

      <div class="sheet__body">
        <dl class="facts" id="taskFacts"></dl>
        <div class="log" id="taskLog"></div>
      </div>

      <footer class="sheet__foot">
        <span class="sheet__note" id="taskHint"></span>
        <button type="button" class="cta" data-close="taskDialog">关闭</button>
      </footer>
    </dialog>

    <div class="toast-layer" id="toastLayer"></div>
    <script type="module" src="app.js"></script>
  </body>
</html>
